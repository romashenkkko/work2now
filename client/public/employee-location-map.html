<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee location map</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.75rem 0;
    }
    /* Map container: full width, fixed height, rounded corners */
    #map {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: #e8e8e8;
    }
    /* Status / error message below map */
    .status {
      margin-top: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
    }
    .status.loading { background: #e3f2fd; color: #1565c0; }
    .status.success { background: #e8f5e9; color: #2e7d32; }
    .status.error   { background: #ffebee; color: #c62828; }
    .status.hidden  { display: none; }
    /* Coordinates display */
    .coords {
      margin-top: 0.5rem;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Employee current location</h1>
    <div id="map"></div>
    <div id="status" class="status loading">Requesting location permission…</div>
    <div id="coords" class="coords"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    // -------------------------------------------------------------------------
    // 1. DOM elements and map state
    // -------------------------------------------------------------------------
    const mapEl = document.getElementById('map');
    const statusEl = document.getElementById('status');
    const coordsEl = document.getElementById('coords');

    let map = null;           // Leaflet map instance
    let marker = null;        // Single marker for employee position
    let watchId = null;       // ID from navigator.geolocation.watchPosition

    // Default center (e.g. office) if we need to show map before we have a position
    const DEFAULT_CENTER = [46.99, 28.98]; // Chisinau
    const DEFAULT_ZOOM = 15;

    // -------------------------------------------------------------------------
    // 2. Show status message (loading / success / error)
    // -------------------------------------------------------------------------
    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status ' + (type || 'loading');
      statusEl.classList.remove('hidden');
    }

    function setCoords(lat, lng) {
      coordsEl.textContent = lat != null && lng != null
        ? `Lat: ${lat.toFixed(6)}  ·  Lng: ${lng.toFixed(6)}`
        : '';
    }

    // -------------------------------------------------------------------------
    // 3. Initialize Leaflet map (only once)
    // -------------------------------------------------------------------------
    function initMap(center) {
      if (map) return;
      center = center || DEFAULT_CENTER;
      map = L.map('map').setView(center, DEFAULT_ZOOM);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; CARTO'
      }).addTo(map);
    }

    // -------------------------------------------------------------------------
    // 4. Add or update the employee marker and center map on it
    // -------------------------------------------------------------------------
    function updatePosition(lat, lng) {
      if (!map) initMap([lat, lng]);
      if (!marker) {
        marker = L.marker([lat, lng]).addTo(map);
      } else {
        marker.setLatLng([lat, lng]);
      }
      map.setView([lat, lng], map.getZoom());
      setCoords(lat, lng);
    }

    // -------------------------------------------------------------------------
    // 5. Handle successful position (first fix and updates from watchPosition)
    // -------------------------------------------------------------------------
    function onPositionSuccess(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      updatePosition(lat, lng);
      setStatus('Location updated. Map is centered on your position.', 'success');
    }

    // -------------------------------------------------------------------------
    // 6. Handle geolocation errors (permission denied, unavailable, etc.)
    // -------------------------------------------------------------------------
    function onPositionError(err) {
      if (watchId != null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      let msg = 'Location could not be retrieved.';
      switch (err.code) {
        case err.PERMISSION_DENIED:
          msg = 'Location permission was denied. Enable location access to see your position on the map.';
          break;
        case err.POSITION_UNAVAILABLE:
          msg = 'Location is unavailable. Check your device settings and try again.';
          break;
        case err.TIMEOUT:
          msg = 'Location request timed out. Please try again.';
          break;
      }
      setStatus(msg, 'error');
      setCoords(null, null);
      // Still show map centered on default so user can see something
      if (!map) initMap();
    }

    // -------------------------------------------------------------------------
    // 7. Start watching position (real-time updates when employee moves)
    // -------------------------------------------------------------------------
    function startWatching() {
      if (!navigator.geolocation) {
        setStatus('Geolocation is not supported by your browser.', 'error');
        initMap();
        return;
      }
      // First try to get a single fix so we can center the map quickly
      navigator.geolocation.getCurrentPosition(
        function (position) {
          onPositionSuccess(position);
          // Then watch for ongoing updates (e.g. employee moving)
          watchId = navigator.geolocation.watchPosition(
            onPositionSuccess,
            onPositionError,
            {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 5000
            }
          );
        },
        onPositionError,
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // -------------------------------------------------------------------------
    // 8. Initialize on page load
    // -------------------------------------------------------------------------
    startWatching();
  </script>
</body>
</html>
